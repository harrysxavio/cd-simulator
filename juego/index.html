<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#0e1726">
 <meta name="description" content="Misión CD: MVP alfa interactivo para aprender a dirigir un centro de distribución con un caso reproducible.">
 <title>Misión CD · MVP alfa jugable</title>
 <link rel="icon" href="data:,">
 <link rel="stylesheet" href="./styles.css">
</head>
<body>
 <a class="skip-link" href="#gameScene">Saltar a la misión</a>
 <div class="app-shell">
  <header class="topbar">
   <div class="top-row">
    <div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><span>Misión <strong>CD</strong></span></div>
    <a class="return-link" href="../" aria-label="Regresar al simulador tradicional">← Laboratorio</a>
   </div>
   <div class="stage-row">
    <span id="gameStage" aria-live="polite">MVP alfa · Presentación</span>
    <button id="gameRestart" type="button" class="restart-link" hidden>Reiniciar</button>
   </div>
   <div class="chapter-row">
    <span id="gameChapter">Capítulo 1 de 4 · Prepararse</span>
    <button id="gameMapOpen" class="map-open" type="button" aria-haspopup="dialog">Ver mapa</button>
   </div>
   <div class="progress-track" id="gameProgressTrack" role="progressbar" aria-label="Progreso de la misión" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Introducción">
    <div id="gameProgress" class="progress-fill" style="width:0%"></div>
   </div>
  </header>
  <main class="scene-scroll" id="gameScene" tabindex="-1">
   <h1>Cargando Misión CD…</h1>
  </main>
  <p id="gameError" class="error-line" role="alert" aria-live="assertive"></p>
  <footer class="action-bar" aria-label="Navegación de la misión">
   <button id="gameBack" type="button" class="action-secondary" hidden>← Atrás</button>
   <button id="gameNext" type="button" class="action-primary">Comenzar misión →</button>
  </footer>
 </div>
 <script type="module" src="./app.js"></script>
</body>
</html>
