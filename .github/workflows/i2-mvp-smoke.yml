name: I2 MVP focused verification
on:
  pull_request:
    paths:
      - 'juego/**'
      - 'src/i2-*.js'
      - 'src/recovery.js'
      - 'src/sku-operational-cost.js'
      - 'tests/i2-mvp-adapter.test.mjs'
      - 'tests/i2-challenge-config.test.mjs'
      - 'tests/i2-advanced-settings.test.mjs'
      - 'tests/i2-nico-tutorial.test.mjs'
      - 'tests/i2-nico-manager-learning.test.mjs'
      - 'tests/i2-area-planning-indicators.test.mjs'
      - 'tests/i2-commercial-forecast-lesson.test.mjs'
      - 'tests/i2-planning-coverage.test.mjs'
      - 'tests/i2-supplier-purchasing.test.mjs'
      - 'tests/i2-receiving-dock.test.mjs'
      - 'tests/i2-quality-release.test.mjs'
      - 'tests/i2-inventory-physical.test.mjs'
      - 'tests/i2-picking-bom.test.mjs'
      - 'tests/i2-transport-dispatch.test.mjs'
      - 'tests/i2-demand-event.test.mjs'
      - 'tests/i2-management-diagnosis.test.mjs'
      - 'tests/i2-multi-recovery.test.mjs'
      - 'tests/i2-nico-art.test.mjs'
      - 'tests/browser-i2-*.e2e.mjs'
      - '.github/workflows/i2-mvp-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i2-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: I2 physical adapter unit tests
        run: node --experimental-default-type=module --test tests/i2-product-contract.test.mjs tests/i2-mvp-adapter.test.mjs tests/i2-game-campaign-adapter.test.mjs tests/i2-game-state.test.mjs tests/i2-economic-privacy.test.mjs tests/i2-visual-tokens.test.mjs tests/i2-game-navigation.test.mjs tests/i2-game-progress.test.mjs tests/i2-game-guide.test.mjs tests/i2-first-mission-briefing.test.mjs tests/i2-management-objectives.test.mjs tests/i2-challenge-config.test.mjs tests/i2-advanced-settings.test.mjs tests/i2-nico-tutorial.test.mjs tests/i2-nico-manager-learning.test.mjs tests/i2-area-planning-indicators.test.mjs tests/i2-commercial-forecast-lesson.test.mjs tests/i2-planning-coverage.test.mjs tests/i2-supplier-purchasing.test.mjs tests/i2-receiving-dock.test.mjs tests/i2-quality-release.test.mjs tests/i2-inventory-physical.test.mjs tests/i2-picking-bom.test.mjs tests/i2-transport-dispatch.test.mjs tests/i2-demand-event.test.mjs tests/i2-management-diagnosis.test.mjs tests/i2-multi-recovery.test.mjs tests/i2-nico-art.test.mjs
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.64.0
      - name: Focused game journey and entry
        env:
          E2E_CHROMIUM_PATH: /usr/bin/chromium
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/i2-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/juego/ >/dev/null; then break; fi
            sleep 1
          done
          node --experimental-default-type=module --test --test-concurrency=1 tests/browser-i2-game-route.e2e.mjs tests/browser-i2-entry-link.e2e.mjs tests/browser-i2-mvp-alpha.e2e.mjs tests/browser-i2-game-state.e2e.mjs tests/browser-i2-boundary.e2e.mjs tests/browser-i2-mobile-shell.e2e.mjs tests/browser-i2-navigation.e2e.mjs tests/browser-i2-help-dialog.e2e.mjs tests/browser-i2-chapter-progress.e2e.mjs tests/browser-i2-guide.e2e.mjs tests/browser-i2-first-briefing.e2e.mjs tests/browser-i2-management-objectives.e2e.mjs tests/browser-i2-challenges.e2e.mjs tests/browser-i2-advanced-settings.e2e.mjs tests/browser-i2-nico-tutorial.e2e.mjs tests/browser-i2-nico-manager-learning.e2e.mjs tests/browser-i2-area-tabs.e2e.mjs tests/browser-i2-commercial-forecast.e2e.mjs tests/browser-i2-planning-coverage.e2e.mjs tests/browser-i2-supplier-purchasing.e2e.mjs tests/browser-i2-receiving-dock.e2e.mjs tests/browser-i2-quality-release.e2e.mjs tests/browser-i2-inventory-physical.e2e.mjs tests/browser-i2-picking-bom.e2e.mjs tests/browser-i2-transport-dispatch.e2e.mjs tests/browser-i2-demand-event.e2e.mjs tests/browser-i2-management-diagnosis.e2e.mjs tests/browser-i2-nico-original-art.e2e.mjs
