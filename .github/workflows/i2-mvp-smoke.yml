name: I2 MVP focused verification
on:
  pull_request:
    paths:
      - 'juego/**'
      - 'src/i2-*.js'
      - 'tests/i2-mvp-adapter.test.mjs'
      - 'tests/browser-i2-*.e2e.mjs'
      - '.github/workflows/i2-mvp-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i2-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: I2 physical adapter unit tests
        run: node --experimental-default-type=module --test tests/i2-product-contract.test.mjs tests/i2-mvp-adapter.test.mjs tests/i2-game-campaign-adapter.test.mjs tests/i2-game-state.test.mjs tests/i2-economic-privacy.test.mjs tests/i2-visual-tokens.test.mjs tests/i2-game-navigation.test.mjs
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.64.0
      - name: Focused game journey and entry
        env:
          E2E_CHROMIUM_PATH: /usr/bin/chromium
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/i2-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/juego/ >/dev/null; then break; fi
            sleep 1
          done
          node --experimental-default-type=module --test --test-concurrency=1 tests/browser-i2-game-route.e2e.mjs tests/browser-i2-entry-link.e2e.mjs tests/browser-i2-mvp-alpha.e2e.mjs tests/browser-i2-game-state.e2e.mjs tests/browser-i2-boundary.e2e.mjs tests/browser-i2-mobile-shell.e2e.mjs tests/browser-i2-navigation.e2e.mjs tests/browser-i2-help-dialog.e2e.mjs
