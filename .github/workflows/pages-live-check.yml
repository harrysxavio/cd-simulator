name: Live GitHub Pages release verification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify real public Pages matches main
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published HTML, release manifest and module assets
        env:
          PAGES_URL: https://harrysxavio.github.io/cd-simulator/
          VERIFY_ATTEMPTS: '42'
          VERIFY_INTERVAL_MS: '10000'
        run: node scripts/verify-pages.mjs
